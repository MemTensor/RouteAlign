# 微调任务画像模型注册表（RouteAlign）
#
# 六个本地微调模型（下载或训练后置于 models/ 下），各自通过 sglang
# 独立服务（scripts/serve_trained_models.sh 启动，每 GPU 一个服务）。
# - router_21K_*：21K 任务画像数据 SFT 版本
# - grpo_router_*：GRPO 强化学习版本
# 评估驱动 adapter/run_trained_eval.py 与服务脚本均读取本文件。

models:
  router_21K_Qwen3-0.6B:
    model_path: models/router_21K_Qwen3-0.6B
    gpu: 0
    port: 30031
  router_21K_Qwen3-1.7B:
    model_path: models/router_21K_Qwen3-1.7B
    gpu: 1
    port: 30032
  router_21K_Qwen3-4B:
    model_path: models/router_21K_Qwen3-4B
    gpu: 2
    port: 30033
  grpo_router_Qwen3-0.6B:
    model_path: models/grpo_router_Qwen3-0.6B
    gpu: 3
    port: 30034
  grpo_router_Qwen3-1.7B:
    model_path: models/grpo_router_Qwen3-1.7B
    gpu: 4
    port: 30035
  grpo_router_Qwen3-4B:
    model_path: models/grpo_router_Qwen3-4B
    gpu: 5
    port: 30036

# sglang 服务参数
serve:
  mem_fraction_static: 0.85
  max_running_requests: 256

# 任务画像调用参数（写入生成的 demo_router 配置）
profile:
  temperature: 0.0
  timeout: 600
  max_tokens: 1024
  prompt_style: sft_v3
